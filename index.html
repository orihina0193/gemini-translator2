<!DOCTYPE html>
<html lang="ja" class="h-full bg-[#f5f5f7]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 翻訳</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .font-mono {
            font-family: "JetBrains Mono", monospace;
        }
    </style>
</head>
<body class="min-h-full text-[#1d1d1f] flex flex-col items-center pt-6 pb-12 px-4 selection:bg-[#007aff]/20">

    <div class="w-full max-w-[600px] flex flex-col gap-4">

        <!-- ヘッダー -->
        <header class="flex flex-col px-1">
            <h1 class="text-[28px] font-bold tracking-tight text-[#1d1d1f] leading-tight">Gemini 翻訳</h1>
            <div class="mt-1 flex items-center gap-1.5 text-[13px] text-[#86868b]">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status" class="font-mono">APIキーを確認中...</span>
            </div>
        </header>

        <!-- タブ切り替え -->
        <nav class="bg-[#e8e8ed] p-1 rounded-xl flex gap-1">
            <button id="tab-btn-1" onclick="switchTab(1)" class="flex-1 py-2 px-2 rounded-lg text-[13px] font-semibold cursor-pointer transition-all">外国語 → 日本語</button>
            <button id="tab-btn-2" onclick="switchTab(2)" class="flex-1 py-2 px-2 rounded-lg text-[13px] font-semibold cursor-pointer transition-all">日本語 → 外国語 → 日本語</button>
        </nav>

        <main class="flex flex-col gap-4">

            <!-- タブ1: 外国語 → 日本語 -->
            <section id="tab-1" class="flex flex-col gap-4">
                <div id="t1-input-slot"></div>
                <div id="t1-error" class="hidden bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl flex items-start gap-2.5 shadow-sm text-sm">
                    <span class="text-red-500 shrink-0 mt-0.5">⚠️</span>
                    <div>
                        <h4 class="font-semibold text-red-700 mb-0.5">エラーが発生しました</h4>
                        <p id="t1-error-msg"></p>
                    </div>
                </div>
                <div id="t1-result-card" class="hidden bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 pt-4 flex flex-col gap-3">
                    <div class="text-xs font-bold tracking-wider text-[#86868b] flex justify-between items-center">
                        <span>日本語訳</span>
                        <button id="t1-copy" onclick="copyResult('t1-result','t1-copy')" class="text-[#007aff] hover:text-[#0063cc] font-medium text-xs cursor-pointer transition-colors">結果をコピー</button>
                    </div>
                    <div id="t1-result" class="min-h-[120px] bg-[#fafafa] rounded-xl border border-[#e5e5e5] p-4 text-base leading-relaxed text-[#1d1d1f] break-words whitespace-pre-wrap"></div>
                </div>
            </section>

            <!-- タブ2: 日本語 → 外国語 → 日本語 -->
            <section id="tab-2" class="hidden flex flex-col gap-4">
                <!-- 言語選択 -->
                <div class="bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 flex flex-col gap-3">
                    <div class="text-xs font-bold tracking-wider text-[#86868b]">翻訳先の言語</div>
                    <div id="lang-buttons" class="flex flex-wrap gap-2"></div>
                </div>
                <div id="t2-input-slot"></div>
                <div id="t2-error" class="hidden bg-red-50 border border-red-100 text-red-600 p-4 rounded-xl flex items-start gap-2.5 shadow-sm text-sm">
                    <span class="text-red-500 shrink-0 mt-0.5">⚠️</span>
                    <div>
                        <h4 class="font-semibold text-red-700 mb-0.5">エラーが発生しました</h4>
                        <p id="t2-error-msg"></p>
                    </div>
                </div>
                <div id="t2-result-card" class="hidden flex flex-col gap-4">
                    <!-- 外国語訳 -->
                    <div class="bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 pt-4 flex flex-col gap-3">
                        <div class="text-xs font-bold tracking-wider text-[#86868b] flex justify-between items-center">
                            <span id="t2-fwd-label">外国語訳</span>
                            <button id="t2-fwd-copy" onclick="copyResult('t2-fwd','t2-fwd-copy')" class="text-[#007aff] hover:text-[#0063cc] font-medium text-xs cursor-pointer transition-colors">結果をコピー</button>
                        </div>
                        <div id="t2-fwd" class="min-h-[80px] bg-[#fafafa] rounded-xl border border-[#e5e5e5] p-4 text-base leading-relaxed text-[#1d1d1f] break-words whitespace-pre-wrap"></div>
                    </div>
                    <!-- 訳し戻し(日本語で確認) -->
                    <div class="bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 pt-4 flex flex-col gap-3">
                        <div class="text-xs font-bold tracking-wider text-[#86868b] flex justify-between items-center">
                            <span>日本語で確認(訳し戻し)</span>
                            <button id="t2-back-copy" onclick="copyResult('t2-back','t2-back-copy')" class="text-[#007aff] hover:text-[#0063cc] font-medium text-xs cursor-pointer transition-colors">結果をコピー</button>
                        </div>
                        <div id="t2-back" class="min-h-[80px] bg-[#fafafa] rounded-xl border border-[#e5e5e5] p-4 text-base leading-relaxed text-[#1d1d1f] break-words whitespace-pre-wrap"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="mt-auto pt-12 text-[11px] text-[#86868b] font-mono text-center space-y-1">
            <p>Gemini 翻訳 &copy; <span id="current-year"></span></p>
        </footer>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // ============================================================
        // 設定(将来モデルが廃止されたら、ここだけ書き換えればOK)
        // ============================================================
        const MODEL = "gemini-3.5-flash-lite";

        // URLの ?key=... からAPIキーを取得(ブックマーク運用)
        const apiKey = new URLSearchParams(window.location.search).get('key');

        const LANGS = [
            { label: '英語',         name: '英語' },
            { label: '中国語',       name: '中国語（簡体字）' },
            { label: '韓国語',       name: '韓国語' },
            { label: 'スペイン語',   name: 'スペイン語' },
            { label: 'フランス語',   name: 'フランス語' },
            { label: 'ロシア語',     name: 'ロシア語' },
            { label: 'ポルトガル語', name: 'ポルトガル語' },
        ];
        let langIdx = 0;

        const busy = { t1: false, t2: false };

        // ============================================================
        // Gemini呼び出し(ヘッダー認証・共通)
        // ============================================================
        async function callGemini(prompt) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': apiKey
                },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });
            const json = await response.json();
            if (json.error) throw new Error(json.error.message);
            const parts = json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts;
            const text = parts ? parts.map(p => p.text || '').join('').trim() : '';
            if (!text) throw new Error('AIから回答が得られませんでした。');
            return text;
        }

        // ============================================================
        // プロンプト
        // ============================================================
        const NO_NOTE = '注釈、補足、「※」から始まる説明、別の解釈の可能性への言及は一切書かないでください。';

        function promptToJapanese(text) {
            return `あなたは翻訳者です。以下の文章を、自然な日本語に翻訳してください。
翻訳結果のみを出力してください。${NO_NOTE}

---
対象テキスト:
${text}`;
        }

        function promptForward(lang, text) {
            return `あなたは翻訳者です。目標は、以下の文章を自然で温かみのある${lang}に翻訳することです。
- トーン：親しみやすく、かつ相手に敬意を払った「丁寧な日常会話」の雰囲気で。
- 堅苦しいビジネス表現や、冷たい直訳は避けてください。
- 友人や親しい同僚に話しかけるような、柔らかい表現を選んでください。
- 翻訳結果のみを出力してください。${NO_NOTE}

---
対象テキスト:
${text}`;
        }

        function promptBack(text) {
            return `あなたは日本語翻訳者です。目標は、指定された文章を『親しみやすく、自然な丁寧語（カジュアル寄りのですます調）』で日本語に訳し戻すことです。
- 制約：直訳を避け、日本語として自然なリズムの言葉を選んでください。
- 表現：日常会話で使うような柔らかな表現を使い、堅苦しい言葉遣いは避けてください。
- トーン：相手に親近感を与えつつ、失礼のない『です・ます』を維持してください。
- 翻訳結果のみを出力してください。${NO_NOTE}

---
対象テキスト:
${text}`;
        }

        // ============================================================
        // 入力カード(2つのタブで共通)
        // ============================================================
        function inputCardHTML(p, placeholder, execLabel) {
            return `
            <div class="bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 flex flex-col gap-3">
                <div class="flex justify-end gap-2 -mb-1">
                    <button onclick="pasteInto('${p}')" class="bg-[#e8e8ed] hover:bg-[#d8d8dd] text-[#1d1d1f] px-3 py-1.5 rounded-lg text-[13px] font-medium cursor-pointer transition-colors flex items-center gap-1 active:opacity-75">
                        <span>📋</span><span>貼り付け</span>
                    </button>
                    <button id="${p}-clear" onclick="clearPanel('${p}')" disabled class="bg-[#e8e8ed] hover:bg-[#d8d8dd] text-[#1d1d1f] px-3 py-1.5 rounded-lg text-[13px] font-medium cursor-pointer transition-colors flex items-center gap-1 active:opacity-75 disabled:opacity-40 disabled:cursor-not-allowed">
                        <span>🗑️</span><span>クリア</span>
                    </button>
                </div>
                <div class="relative">
                    <textarea id="${p}-input" oninput="refresh('${p}')" placeholder="${placeholder}" class="w-full h-[160px] border border-[#d2d2d7] rounded-xl p-3.5 text-base leading-relaxed outline-none transition-all duration-200 resize-none focus:border-[#007aff] focus:ring-4 focus:ring-[#007aff]/10"></textarea>
                    <div id="${p}-count" class="absolute bottom-3 right-3 text-[10px] text-[#86868b] font-mono bg-white/80 px-1 rounded hidden">0 文字</div>
                </div>
                <div id="${p}-toast" class="hidden text-xs text-amber-600 bg-amber-50 p-2.5 rounded-lg border border-amber-100 flex items-start gap-1.5">
                    <span>⚠️</span><span id="${p}-toast-msg"></span>
                </div>
                <button id="${p}-exec" onclick="run('${p}')" disabled class="w-full py-4 bg-[#007aff] hover:bg-[#0063cc] disabled:bg-[#ccc] disabled:shadow-none text-white font-semibold rounded-[14px] text-[17px] transition-all cursor-pointer disabled:cursor-not-allowed shadow-[0_4px_12px_rgba(0,122,255,0.2)] active:scale-[0.99] flex items-center justify-center gap-2">
                    <span id="${p}-exec-text">${execLabel}</span>
                </button>
            </div>`;
        }

        const EXEC_LABEL = { t1: '翻訳実行', t2: '翻訳して確認' };
        document.getElementById('t1-input-slot').innerHTML = inputCardHTML('t1', '翻訳したい外国語の文章を入力...', EXEC_LABEL.t1);
        document.getElementById('t2-input-slot').innerHTML = inputCardHTML('t2', '外国語に翻訳したい日本語の文章を入力...', EXEC_LABEL.t2);

        function refresh(p) {
            const value = document.getElementById(`${p}-input`).value;
            const count = document.getElementById(`${p}-count`);
            if (value.length > 0) {
                count.textContent = `${value.length} 文字`;
                count.classList.remove('hidden');
            } else {
                count.classList.add('hidden');
            }
            document.getElementById(`${p}-exec`).disabled = !apiKey || value.trim().length === 0 || busy[p];
            const hasResult = !document.getElementById(`${p}-result-card`).classList.contains('hidden');
            document.getElementById(`${p}-clear`).disabled = value.length === 0 && !hasResult;
        }

        function showToast(p, msg) {
            const toast = document.getElementById(`${p}-toast`);
            document.getElementById(`${p}-toast-msg`).textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        async function pasteInto(p) {
            document.getElementById(`${p}-toast`).classList.add('hidden');
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) {
                    throw new Error('unsupported');
                }
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById(`${p}-input`).value = text;
                    refresh(p);
                } else {
                    showToast(p, 'クリップボードは空です。');
                }
            } catch (err) {
                showToast(p, '貼り付けに失敗しました。手動でペーストしてください。');
            }
        }

        function clearPanel(p) {
            document.getElementById(`${p}-input`).value = '';
            document.getElementById(`${p}-result-card`).classList.add('hidden');
            document.getElementById(`${p}-error`).classList.add('hidden');
            document.getElementById(`${p}-toast`).classList.add('hidden');
            if (p === 't1') {
                document.getElementById('t1-result').textContent = '';
            } else {
                document.getElementById('t2-fwd').textContent = '';
                document.getElementById('t2-back').textContent = '';
            }
            refresh(p);
        }

        async function copyResult(resultId, btnId) {
            const text = document.getElementById(resultId).textContent;
            const btn = document.getElementById(btnId);
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                btn.textContent = 'コピー完了';
                btn.classList.replace('text-[#007aff]', 'text-emerald-500');
                setTimeout(() => {
                    btn.textContent = '結果をコピー';
                    btn.classList.replace('text-emerald-500', 'text-[#007aff]');
                }, 2000);
            } catch (err) {
                btn.textContent = 'コピー失敗';
                setTimeout(() => { btn.textContent = '結果をコピー'; }, 2000);
            }
        }

        // ============================================================
        // 実行
        // ============================================================
        function setBusy(p, isBusy) {
            busy[p] = isBusy;
            document.getElementById(`${p}-exec-text`).textContent = isBusy ? '翻訳中...' : EXEC_LABEL[p];
            refresh(p);
        }

        function showError(p, message) {
            document.getElementById(`${p}-error-msg`).textContent = message;
            document.getElementById(`${p}-error`).classList.remove('hidden');
        }

        async function run(p) {
            const input = document.getElementById(`${p}-input`).value.trim();
            if (!input || !apiKey) return;
            document.getElementById(`${p}-error`).classList.add('hidden');
            setBusy(p, true);
            try {
                if (p === 't1') {
                    await runToJapanese(input);
                } else {
                    await runRoundTrip(input);
                }
            } catch (e) {
                document.getElementById(`${p}-result-card`).classList.add('hidden');
                showError(p, e.message);
            } finally {
                setBusy(p, false);
            }
        }

        // タブ1: 外国語 → 日本語
        async function runToJapanese(input) {
            const card = document.getElementById('t1-result-card');
            const box = document.getElementById('t1-result');
            card.classList.remove('hidden');
            box.textContent = '翻訳中...';
            box.classList.add('animate-pulse');
            try {
                box.textContent = await callGemini(promptToJapanese(input));
            } finally {
                box.classList.remove('animate-pulse');
            }
        }

        // タブ2: 日本語 → 外国語 → 日本語
        async function runRoundTrip(input) {
            const lang = LANGS[langIdx];
            const card = document.getElementById('t2-result-card');
            const fwd = document.getElementById('t2-fwd');
            const back = document.getElementById('t2-back');
            document.getElementById('t2-fwd-label').textContent = `${lang.label}訳`;
            card.classList.remove('hidden');
            fwd.textContent = '翻訳中...';
            back.textContent = '';
            fwd.classList.add('animate-pulse');

            let forward;
            try {
                forward = await callGemini(promptForward(lang.name, input));
                fwd.textContent = forward;
            } finally {
                fwd.classList.remove('animate-pulse');
            }

            // 外国語訳ができたら、すぐに日本語へ訳し戻す
            back.textContent = '訳し戻し中...';
            back.classList.add('animate-pulse');
            try {
                back.textContent = await callGemini(promptBack(forward));
            } catch (e) {
                back.textContent = '';
                showError('t2', `訳し戻しに失敗しました: ${e.message}`);
            } finally {
                back.classList.remove('animate-pulse');
            }
        }

        // ============================================================
        // 言語選択・タブ切り替え
        // ============================================================
        const LANG_ON  = 'bg-[#007aff] text-white shadow-[0_2px_8px_rgba(0,122,255,0.25)]';
        const LANG_OFF = 'bg-[#e8e8ed] text-[#1d1d1f] hover:bg-[#d8d8dd]';

        function renderLangs() {
            document.getElementById('lang-buttons').innerHTML = LANGS.map((l, i) =>
                `<button onclick="selectLang(${i})" class="px-3.5 py-2 rounded-full text-[14px] font-medium cursor-pointer transition-all active:scale-[0.97] ${i === langIdx ? LANG_ON : LANG_OFF}">${l.label}</button>`
            ).join('');
        }

        function selectLang(i) {
            langIdx = i;
            renderLangs();
        }

        const TAB_ON  = 'bg-white text-[#1d1d1f] shadow-sm';
        const TAB_OFF = 'text-[#86868b] hover:text-[#1d1d1f]';

        function switchTab(n) {
            [1, 2].forEach(i => {
                document.getElementById(`tab-${i}`).classList.toggle('hidden', i !== n);
                const btn = document.getElementById(`tab-btn-${i}`);
                btn.className = `flex-1 py-2 px-2 rounded-lg text-[13px] font-semibold cursor-pointer transition-all ${i === n ? TAB_ON : TAB_OFF}`;
            });
        }

        // ============================================================
        // 初期化
        // ============================================================
        const statusDiv = document.getElementById('status');
        const statusDot = document.getElementById('status-dot');
        if (!apiKey) {
            statusDiv.innerHTML = "<span style='color:#d70000;'>⚠️ URLに ?key=YOUR_KEY がありません。</span>";
            statusDot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
        } else {
            statusDiv.textContent = `Ready: ${MODEL}`;
            statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
        }
        renderLangs();
        switchTab(2);
        refresh('t1');
        refresh('t2');
    </script>
</body>
</html>
