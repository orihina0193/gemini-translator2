<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 爆速翻訳機</title>
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #007aff;
            --primary-hover: #0063cc;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-muted: #86868b;
            --border: #d2d2d7;
            --secondary-btn: #e8e8ed;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-6 pb-12 px-4 select-none">

    <div class="w-full max-w-[600px] flex flex-col gap-4">
        
        <!-- ヘッダーエリア -->
        <header class="flex justify-between items-end px-1">
            <div class="flex flex-col">
                <h1 class="text-[28px] font-bold tracking-tight text-[#1d1d1f] leading-tight">
                    Gemini 翻訳
                </h1>
                <!-- ステータスバー -->
                <div id="status" class="mt-1 flex items-center gap-1.5 text-[13px] text-[#86868b] font-mono">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="status-text">APIキーを確認中...</span>
                </div>
            </div>
        </header>

        <!-- メインカード (入力) -->
        <main class="flex flex-col gap-4">
            <div class="bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 flex flex-col gap-3">
                
                <!-- ツールバー -->
                <div class="flex justify-end gap-2 -mb-1">
                    <!-- 貼り付けボタン -->
                    <button 
                        id="pasteBtn" 
                        onclick="pasteText()" 
                        class="bg-[#e8e8ed] hover:bg-[#d8d8dd] text-[#1d1d1f] px-3 py-1.5 rounded-lg text-[13px] font-medium cursor-pointer transition-colors flex items-center gap-1 active:opacity-75"
                    >
                        <span>📋</span> 貼り付け
                    </button>
                    <!-- クリアボタン -->
                    <button 
                        id="clearBtn" 
                        onclick="clearText()" 
                        class="bg-[#e8e8ed] hover:bg-[#d8d8dd] text-[#1d1d1f] px-3 py-1.5 rounded-lg text-[13px] font-medium cursor-pointer transition-colors flex items-center gap-1 active:opacity-75 disabled:opacity-40 disabled:cursor-not-allowed"
                        disabled
                    >
                        <span>🗑️</span> クリア
                    </button>
                </div>

                <!-- テキストエリア -->
                <div class="relative w-full">
                    <textarea 
                        id="input" 
                        oninput="onInputText()"
                        placeholder="翻訳したい文章を入力..." 
                        class="w-full h-[160px] border border-[#d2d2d7] rounded-xl p-3.5 text-base leading-relaxed outline-none transition-all duration-200 resize-none focus:border-[#007aff] focus:ring-4 focus:ring-[#007aff]/10"
                    ></textarea>
                </div>

                <!-- エラー/お知らせ表示 -->
                <div id="info-msg" class="hidden text-xs text-amber-600 bg-amber-50 p-2.5 rounded-lg border border-amber-100 flex items-start gap-1.5">
                    <span class="mt-0.5 shrink-0">⚠️</span>
                    <span id="info-msg-text"></span>
                </div>

                <!-- 翻訳実行ボタン -->
                <button 
                    id="execBtn" 
                    onclick="translateText()" 
                    class="w-full py-4 bg-[#007aff] hover:bg-[#0063cc] disabled:bg-[#ccc] disabled:shadow-none text-white font-semibold rounded-[14px] text-[17px] transition-all cursor-pointer disabled:cursor-not-allowed shadow-[0_4px_12px_rgba(0,122,255,0.2)] active:scale-[0.99] flex items-center justify-center gap-2"
                >
                    <span id="btn-icon">⚡</span>
                    <span id="btn-text">翻訳実行</span>
                </button>
            </div>

            <!-- 翻訳結果カード (初期状態は非表示) -->
            <div id="result-card" class="hidden bg-white rounded-[20px] shadow-[0_8px_24px_rgba(0,0,0,0.04)] border border-black/[0.02] p-5 pt-4 flex flex-col gap-3">
                <div class="text-xs font-bold uppercase tracking-wider text-[#86868b] flex justify-between items-center">
                    <div class="flex items-center gap-1">
                        <span>翻訳結果</span>
                        <span class="text-[#007aff] bg-[#007aff]/10 px-1.5 py-0.5 rounded text-[10px] font-mono normal-case tracking-normal">Result ONLY</span>
                    </div>
                    <!-- コピーボタン -->
                    <button 
                        id="copyBtn" 
                        onclick="copyResult()" 
                        class="text-[#007aff] hover:text-[#0063cc] font-medium text-xs cursor-pointer transition-colors normal-case tracking-normal flex items-center gap-1"
                    >
                        結果をコピー
                    </button>
                </div>
                <!-- 翻訳結果表示 -->
                <div id="result" class="min-h-[120px] bg-[#fafafa] rounded-xl border border-[#e5e5e5] p-4 text-base leading-relaxed text-[#1d1d1f] break-words whitespace-pre-wrap">
                    翻訳結果がここに表示されます
                </div>
            </div>
        </main>

        <!-- フッター -->
        <footer class="mt-auto pt-12 text-[11px] text-[#86868b] font-mono text-center space-y-1">
            <p>Gemini 爆速翻訳機 &copy; 2026</p>
            <p class="text-[10px]">自動選別エンジン搭載 • 超低遅延Flash翻訳</p>
        </footer>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('key');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const resultDiv = document.getElementById('result');
        const resultCard = document.getElementById('result-card');
        const execBtn = document.getElementById('execBtn');
        const clearBtn = document.getElementById('clearBtn');
        const inputArea = document.getElementById('input');
        const infoMsg = document.getElementById('info-msg');
        const infoMsgText = document.getElementById('info-msg-text');
        const copyBtn = document.getElementById('copyBtn');

        let selectedModel = "gemini-2.0-flash-lite";

        // APIキーの有無を確認
        if (!apiKey) {
            statusText.innerHTML = "<span style='color:red;'>⚠️ URLに ?key=YOUR_KEY がありません。</span>";
            statusDot.className = "w-2 h-2 rounded-full bg-red-500";
            execBtn.disabled = true;
            execBtn.style.background = "#ccc";
            execBtn.style.cursor = "not-allowed";
        } else {
            statusDot.className = "w-2 h-2 rounded-full bg-[#34c759]";
            statusText.textContent = "Ready: 最適な最速モデルを自動選別します";
            // 起動時に最適なモデルを選別
            getBestModel();
        }

        // 入力時の制御
        function onInputText() {
            const hasText = inputArea.value.trim().length > 0;
            clearBtn.disabled = !hasText && !resultCard.classList.contains('hidden');
        }

        // 最速モデルの自動選別
        async function getBestModel() {
            if (!apiKey) return;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const models = data.models.map(m => m.name.replace('models/', ''));

                // サクサク優先フィルタリング
                let flashModels = models.filter(m => 
                    m.includes('flash') && 
                    !['audio', 'image', 'thinking', 'preview', 'pro'].some(word => m.includes(word))
                );

                let liteModels = flashModels.filter(m => m.includes('lite'));
                
                selectedModel = liteModels.length > 0 ? liteModels[liteModels.length - 1] : 
                                (flashModels.length > 0 ? flashModels[flashModels.length - 1] : "gemini-2.0-flash-lite");

                console.log("Selected Model:", selectedModel);
                statusText.textContent = `Ready: ${selectedModel}`;
            } catch (e) {
                console.error("Model Selection Error:", e);
                selectedModel = "gemini-2.0-flash-lite"; // フォールバック
                statusText.textContent = `Ready: ${selectedModel} (Fallback)`;
            }
        }

        // 翻訳実行
        async function translateText() {
            const input = inputArea.value.trim();
            if (!input || !apiKey) return;

            // 状態リセット
            resultCard.classList.remove('hidden');
            resultDiv.style.color = "#1d1d1f";
            resultDiv.innerHTML = `
                <div class="flex flex-col gap-2 py-1">
                    <div class="h-4 bg-[#f5f5f7] rounded animate-pulse w-3/4"></div>
                    <div class="h-4 bg-[#f5f5f7] rounded animate-pulse w-5/6"></div>
                    <div class="h-4 bg-[#f5f5f7] rounded animate-pulse w-1/2"></div>
                    <div class="text-xs text-[#86868b] animate-pulse mt-2 italic font-mono">思考中...最適なモデルで爆速処理中</div>
                </div>
            `;
            
            execBtn.disabled = true;
            document.getElementById('btn-text').textContent = "翻訳中...";
            document.getElementById('btn-icon').textContent = "⏳";
            statusText.textContent = "最適なモデルを探しています...";

            // 最新のモデルを毎回走査して決定
            const model = await getBestModel().then(() => selectedModel).catch(() => "gemini-2.0-flash-lite");
            statusText.textContent = `使用モデル: ${model}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Translate the following text to Japanese. Result ONLY. No chat, no intro.\n\n${input}` }] }],
                        generationConfig: { temperature: 0.1 }
                    })
                });

                const json = await response.json();

                if (json.error) {
                    throw new Error(json.error.message);
                }

                if (json.candidates && json.candidates[0].content) {
                    const resultText = json.candidates[0].content.parts[0].text.trim();
                    resultDiv.textContent = resultText;
                    statusText.textContent = `翻訳完了 (${model})`;
                    clearBtn.disabled = false;
                } else {
                    throw new Error("レスポンスの形式が想定外です。");
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="bg-[#fff2f2] border border-[#ffcfcf] text-[#d70000] p-3.5 rounded-lg text-sm"><b>エラーが発生しました:</b><br>${e.message}</div>`;
                statusText.textContent = "エラー終了";
            } finally {
                execBtn.disabled = false;
                document.getElementById('btn-text').textContent = "翻訳実行";
                document.getElementById('btn-icon').textContent = "⚡";
            }
        }

        // テキスト貼り付け
        async function pasteText() {
            hideInfo();
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) {
                    throw new Error("ブラウザのセキュリティ設定により、クリップボードAPIを使用できません。");
                }
                const text = await navigator.clipboard.readText();
                if (text) {
                    inputArea.value = text;
                    clearBtn.disabled = false;
                    onInputText();
                } else {
                    showInfo("クリップボードは空です。");
                }
            } catch (err) {
                showInfo("貼り付けに失敗しました。手動で入力するか、ブラウザの権限を確認してください。");
            }
        }

        // 翻訳結果をコピー
        async function copyResult() {
            const text = resultDiv.textContent.trim();
            if (!text || text.includes("翻訳結果がここに表示されます") || text.includes("思考中...")) return;

            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "コピー完了 ✓";
                copyBtn.classList.remove('text-[#007aff]');
                copyBtn.classList.add('text-emerald-500');
                
                setTimeout(() => {
                    copyBtn.textContent = "結果をコピー";
                    copyBtn.classList.remove('text-emerald-500');
                    copyBtn.classList.add('text-[#007aff]');
                }, 2000);
            } catch (err) {
                console.error("Failed to copy:", err);
            }
        }

        // クリア
        function clearText() {
            inputArea.value = "";
            resultDiv.textContent = "翻訳結果がここに表示されます";
            resultCard.classList.add('hidden');
            clearBtn.disabled = true;
            hideInfo();
        }

        // インフォメーション表示用ユーティリティ
        function showInfo(msg) {
            infoMsgText.textContent = msg;
            infoMsg.classList.remove('hidden');
            setTimeout(hideInfo, 4000);
        }

        function hideInfo() {
            infoMsg.classList.add('hidden');
        }
    </script>
</body>
</html>
