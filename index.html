<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 爆速翻訳機</title>
    <style>
        :root {
            --primary: #007aff;
            --primary-hover: #0063cc;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text-muted: #86868b;
            --border: #d2d2d7;
            --secondary-btn: #e8e8ed;
            --secondary-btn-hover: #d8d8dd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Icons', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ヘッダーエリア */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .status-bar {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #34c759;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .status-dot.error {
            background: #ff3b30;
        }

        /* カードレイアウト */
        .card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* ツールバー */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: -4px;
        }

        .tool-btn {
            background: var(--secondary-btn);
            color: var(--text);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .tool-btn:hover {
            background: var(--secondary-btn-hover);
        }

        .tool-btn:active {
            opacity: 0.75;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 入力エリア */
        textarea {
            width: 100%;
            height: 160px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0,122,255,0.1);
        }

        /* 翻訳ボタン */
        .primary-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(0,122,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .primary-btn:active {
            transform: scale(0.99);
        }

        .primary-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 結果セクション */
        .result-header {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-link {
            color: var(--primary);
            cursor: pointer;
            text-transform: none;
            font-weight: 500;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 0;
            font-size: 13px;
        }

        .copy-link:hover {
            color: var(--primary-hover);
        }

        .result-area {
            min-height: 120px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            padding: 16px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 警告・通知スタイル */
        .error-card {
            background: #fff2f2;
            border: 1px solid #ffcfcf;
            color: #d70000;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .notification {
            font-size: 12px;
            color: #b7791f;
            background-color: #fefcbf;
            border: 1px solid #fbd38d;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー -->
        <div class="header">
            <div>
                <h1>Gemini 翻訳</h1>
                <div class="status-bar">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="status">APIキーを確認中...</span>
                </div>
            </div>
        </div>

        <!-- 翻訳入力カード -->
        <div class="card">
            <div class="toolbar">
                <button class="tool-btn" id="pasteBtn" onclick="pasteFromClipboard()">
                    <span>📋</span> 貼り付け
                </button>
                <button class="tool-btn" id="clearBtn" onclick="clearText()" disabled>
                    <span>🗑️</span> クリア
                </button>
            </div>
            
            <textarea id="input" placeholder="翻訳したい文章を入力..." oninput="handleInput()"></textarea>
            
            <div id="pasteError" class="notification" style="display: none;"></div>

            <button class="primary-btn" id="execBtn" onclick="translateText()">翻訳実行</button>
        </div>

        <!-- 翻訳結果カード -->
        <div class="card" id="resultCard" style="padding-top: 16px; display: none;">
            <div class="result-header">
                <span>翻訳結果</span>
                <button class="copy-link" id="copyBtn" onclick="copyToClipboard()">結果をコピー</button>
            </div>
            <div class="result-area" id="result">翻訳結果がここに表示されます</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('key');
        const statusDiv = document.getElementById('status');
        const statusDot = document.getElementById('statusDot');
        const resultDiv = document.getElementById('result');
        const resultCard = document.getElementById('resultCard');
        const execBtn = document.getElementById('execBtn');
        const clearBtn = document.getElementById('clearBtn');
        const inputArea = document.getElementById('input');
        const copyBtn = document.getElementById('copyBtn');
        const pasteErrorDiv = document.getElementById('pasteError');

        let selectedModel = "gemini-2.0-flash-lite";

        // キーチェックと初期化
        if (!apiKey) {
            statusDiv.innerHTML = "<span style='color:#ff3b30;'>⚠️ URLに ?key=YOUR_KEY がありません。</span>";
            statusDot.classList.add('error');
            execBtn.disabled = true;
            execBtn.style.background = "#ccc";
        } else {
            statusDiv.textContent = "Ready: 最新のFlashモデルを選別中...";
            getBestModel();
        }

        // 入力状況に応じてクリアボタンを制御
        function handleInput() {
            clearBtn.disabled = (inputArea.value.trim() === "" && resultDiv.textContent === "翻訳結果がここに表示されます");
        }

        // クリップボードからテキストを貼り付け
        async function pasteFromClipboard() {
            pasteErrorDiv.style.display = "none";
            try {
                if (!navigator.clipboard || !navigator.clipboard.readText) {
                    throw new Error("ブラウザがクリップボード読み取りに対応していません。");
                }
                const text = await navigator.clipboard.readText();
                if (text) {
                    inputArea.value = text;
                    clearBtn.disabled = false;
                } else {
                    showPasteError("クリップボードが空です。");
                }
            } catch (err) {
                showPasteError("貼り付けに失敗しました。手動で入力するか、権限を許可してください。");
            }
        }

        function showPasteError(msg) {
            pasteErrorDiv.textContent = msg;
            pasteErrorDiv.style.display = "block";
            setTimeout(() => {
                pasteErrorDiv.style.display = "none";
            }, 4000);
        }

        // テキストのクリア
        function clearText() {
            inputArea.value = "";
            resultDiv.textContent = "翻訳結果がここに表示されます";
            resultCard.style.display = "none";
            clearBtn.disabled = true;
            pasteErrorDiv.style.display = "none";
        }

        // 結果をクリップボードにコピー
        async function copyToClipboard() {
            const text = resultDiv.innerText;
            if (!text || text === "翻訳結果がここに表示されます") return;
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = "コピー完了！";
                copyBtn.style.color = "#34c759";
                setTimeout(() => {
                    copyBtn.textContent = "結果をコピー";
                    copyBtn.style.color = "var(--primary)";
                }, 2000);
            } catch (err) {
                console.error("コピーに失敗しました", err);
            }
        }

        // 最適な最速モデルを取得
        async function getBestModel() {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const models = data.models.map(m => m.name.replace('models/', ''));

                // 1. "flash" を含み、重い/実験的/プレビュー版を除外
                let flashModels = models.filter(m => 
                    m.includes('flash') && 
                    !['audio', 'image', 'thinking', 'preview', 'pro'].some(word => m.includes(word))
                );

                // 2. その中でも "lite" (最速) を最優先
                let liteModels = flashModels.filter(m => m.includes('lite'));
                
                // 3. liteがあれば最新のliteを、なければ最新のflashを、それもなければ2.0-flash
                selectedModel = liteModels.length > 0 ? liteModels[liteModels.length - 1] : 
                               (flashModels.length > 0 ? flashModels[flashModels.length - 1] : "gemini-2.0-flash-lite");

                statusDiv.textContent = `Ready: ${selectedModel}`;
            } catch (e) {
                console.warn("モデル選別エラー、デフォルトを使用:", e);
                selectedModel = "gemini-2.0-flash-lite"; // フォールバック
                statusDiv.textContent = `Ready: ${selectedModel}`;
            }
        }

        // 翻訳を実行
        async function translateText() {
            const input = inputArea.value.trim();
            if (!input || !apiKey) return;

            // ローディング状態
            resultCard.style.display = "block";
            resultDiv.style.color = "var(--text-muted)";
            resultDiv.textContent = "思考中... 最適なモデルで爆速処理中";
            execBtn.disabled = true;
            clearBtn.disabled = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Translate the following text to Japanese. Result ONLY. No chat, no intro.\n\n${input}` }] }],
                        generationConfig: { temperature: 0.1 }
                    })
                });

                const json = await response.json();

                if (json.error) {
                    throw new Error(json.error.message);
                }

                if (json.candidates && json.candidates[0].content) {
                    resultDiv.style.color = "var(--text)";
                    resultDiv.textContent = json.candidates[0].content.parts[0].text.trim();
                    statusDiv.textContent = `翻訳完了 (${selectedModel})`;
                } else {
                    throw new Error("レスポンスの形式が想定外です。");
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="error-card"><b>エラーが発生しました:</b><br>${e.message}</div>`;
                statusDiv.textContent = "エラー終了";
            } finally {
                execBtn.disabled = false;
                clearBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
